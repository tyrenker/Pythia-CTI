services:
  tor:
    image: alpine:latest
    container_name: pythia-tor
    entrypoint: ["sh", "-c", "apk add --no-cache tor && exec tor -f /etc/tor/torrc"]
    volumes:
      - ./docker/tor/torrc:/etc/tor/torrc:ro
    ports:
      - "127.0.0.1:9050:9050"
      - "127.0.0.1:9051:9051"
    restart: unless-stopped

  pythia:
    build: .
    image: pythia:dev
    container_name: pythia
    depends_on:
      - tor
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DB path so it lands inside the mounted ./db/ directory.
      # The .env default (./pythia.db) is for local non-Docker dev.
      PYTHIA_DATABASE_URL: "sqlite:////app/db/pythia.db"
      PYTHIA_DB_FILE: "/app/db/pythia.db"
      PYTHIA_TOR_HOST: "tor"
      # GeoIP databases live in the mounted ./data/geoip/ volume
      MAXMIND_DB_PATH: "/app/data/geoip/GeoLite2-City.mmdb"
      MAXMIND_ASN_DB_PATH: "/app/data/geoip/GeoLite2-ASN.mmdb"
    volumes:
      - ./data:/app/data      # sigma rules, yara rules, seed data
      - ./db:/app/db          # persistent user data — never deleted on restart
    restart: unless-stopped
